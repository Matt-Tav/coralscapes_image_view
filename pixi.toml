[workspace]
name = "coralscapes-viewer"
version = "0.1.0"
description = "Run Coralscapes DINOv3+DPT segmentation models on images and generate HTML viewers."
channels = ["conda-forge"]
platforms = ["linux-64"]
 
[tasks]
predict = "python scripts/predict_image.py"
 
[dependencies]
python = "3.11.*"
pyyaml = ">=6.0"
pillow = ">=10.0"
tqdm = ">=4.66"
numpy = ">=1.26"
 
[pypi-dependencies]
transformers = ">=4.52.0"
safetensors = ">=0.4.0"
peft = ">=0.12.0"
huggingface_hub = ">=0.20"
 
# GPU (default)
[feature.gpu.pypi-dependencies]
torch = ">=2.8,<2.9"
torchvision = ">=0.23,<0.24"
 
# CPU
[feature.cpu.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]
 
[feature.cpu.pypi-dependencies]
torch = ">=2.8,<2.9"
torchvision = ">=0.23,<0.24"
 
[environments]
default = { features = ["gpu"], solve-group = "default" }
cpu = { features = ["cpu"], solve-group = "cpu" }
